version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5673:5672"
      - "15673:15672" # Management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:15
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ride_booking
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  ride-postgres:
    image: postgres:15
    container_name: ride-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ride_data
    ports:
      - "5433:5432" # Hosted on 5433 externally
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - PORT=3000
      - RABBITMQ_URL=amqp://rabbitmq
      - RIDE_SERVICE_URL=http://ride-service:4000
      - DRIVER_SERVICE_URL=http://driver-service:8081
    depends_on:
      rabbitmq:
        condition: service_healthy

  task-service:
    build: ./task-service
    container_name: task-service
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=ride_booking
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - RABBITMQ_URL=amqp://rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy

  worker-service:
    build: ./worker-service
    container_name: worker-service
    restart: unless-stopped
    environment:
      - RABBITMQ_URL=amqp://rabbitmq
      - TASK_SERVICE_URL=http://task-service:5000
      - DRIVER_SERVICE_URL=http://driver-service:8081
      - RIDE_SERVICE_URL=http://ride-service:4000
    depends_on:
      rabbitmq:
        condition: service_healthy
      task-service:
        condition: service_started
      driver-service:
        condition: service_started
      ride-service:
        condition: service_started

  driver-service:
    build: ./driver-service
    container_name: driver-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - REDIS_URL=redis://redis:6379
      - POSTGRES_URL=postgres://postgres:postgres@postgres:5432/ride_booking?sslmode=disable
      - LOCK_TTL_SECONDS=60
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ride-service:
    build: ./ride-service
    container_name: ride-service
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - RABBITMQ_URL=amqp://rabbitmq
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=ride_data
      - POSTGRES_HOST=ride-postgres
      - POSTGRES_PORT=5432
    depends_on:
      rabbitmq:
        condition: service_healthy
      ride-postgres:
        condition: service_healthy
